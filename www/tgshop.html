<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f4f8);--surface:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));
  --ink:var(--tg-theme-text-color,#14202e);--hint:var(--tg-theme-hint-color,#7d8b99);--link:var(--tg-theme-link-color,#0d7d6f);
  --btn:var(--tg-theme-button-color,#0d7d6f);--btn-ink:var(--tg-theme-button-text-color,#fff);--danger:var(--tg-theme-destructive-text-color,#d64545);
  --line:color-mix(in srgb,var(--hint) 22%,transparent);--soft:color-mix(in srgb,var(--btn) 10%,var(--surface));--ok:#1b8f5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--btn)}
textarea{resize:none;min-height:64px}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--surface);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hrow h1{margin:0;font-size:18px;font-weight:800;flex:1 1 10em;min-width:0;overflow:hidden;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}/* fix199-layout: do'kon nomi 2 qatorgacha */
.icon-btn{border:none;background:var(--soft);border-radius:12px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;font-weight:700;font-size:13px;color:var(--link);gap:6px;flex-shrink:0}
.icon-btn .dot{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.sub{font-size:12.5px;color:var(--hint);margin-top:3px}
.search{margin-top:10px;position:relative}
.search input{padding-left:36px;background:var(--bg);border-color:transparent}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--hint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:999px;border:none;background:var(--surface);font-size:13px;font-weight:700;color:var(--hint)}
.chip.on{background:var(--btn);color:var(--btn-ink)}
.banner{margin:10px 14px 0;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:13px;border-left:4px solid var(--btn)}
.banner.warn{border-left-color:#e3a008}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card.off{opacity:.55}
.thumb{aspect-ratio:1/1;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;color:var(--btn);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pname{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px;word-break:break-word}
.price{font-weight:800;font-size:15px}
.price small{font-weight:500;color:var(--hint);font-size:11.5px}
.tag{font-size:11.5px;color:var(--danger);font-weight:700}
.step{display:flex;align-items:center;gap:4px;margin-top:auto}
.step button{border:none;width:36px;height:36px;border-radius:11px;background:var(--soft);font-size:20px;font-weight:800;color:var(--btn);flex-shrink:0}
.step .qv{flex:1;text-align:center;font-weight:800;border:none;background:none;padding:0;min-width:0}
.addb{margin-top:auto;border:none;border-radius:11px;height:36px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;width:100%}
.addb:disabled{background:var(--line);color:var(--hint)}
.empty{text-align:center;color:var(--hint);padding:40px 20px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar button{width:100%;border:none;border-radius:14px;min-height:52px;background:var(--btn);color:var(--btn-ink);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}
.bar button:disabled{opacity:.55}
.bar button span:last-child{font-variant-numeric:tabular-nums}
.sec{background:var(--surface);border-radius:16px;margin:10px 14px;padding:12px 14px}
.sec h3{margin:0 0 10px;font-size:13px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.line{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:none}
.line .lt{flex:1;min-width:0}
.line .ln{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.line .lp{font-size:12.5px;color:var(--hint)}
.line .ls{font-weight:800;white-space:nowrap}
.line .step{margin:0;width:118px;flex-shrink:0}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--hint)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fld{margin-top:10px}
.fld label{display:block;font-size:12.5px;color:var(--hint);margin-bottom:5px;font-weight:600}
.lnk{border:none;background:none;color:var(--link);font-weight:700;padding:6px 0;font-size:14px}
.okp{display:flex;align-items:center;gap:8px;font-weight:700}
.okp .b{font-size:11.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);border-radius:999px;padding:2px 8px}
.btn2{border:none;border-radius:12px;background:var(--soft);color:var(--link);font-weight:700;padding:11px 12px;width:100%}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.row.t{font-size:17px;font-weight:800;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}
.muted{color:var(--hint);font-size:12.5px}
.err{color:var(--danger);font-size:13.5px;font-weight:600;margin:8px 14px 0}
.done{text-align:center;padding:36px 22px 10px}
.done .ic{width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h2{margin:0 0 6px;font-size:22px}
.ord{background:var(--surface);border-radius:16px;margin:10px 14px;padding:12px 14px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--link);white-space:nowrap}
.st.new{background:#fff4d6;color:#8a5a00}.st.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.st.rejected,.st.cancelled{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;transform:translateY(105%);transition:transform .2s}
.sheet.on{transform:none}
.sheet h3{margin:0 0 12px;font-size:17px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:20;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:.96}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--btn);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* fix150-subbot: tariflar sahifasi animatsiyalari */
@keyframes hubUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes hubPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--btn) 55%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes hubBlink{50%{opacity:.25}}
@keyframes hubFade{from{opacity:0}to{opacity:1}}
@keyframes hubPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes hubDraw{to{stroke-dashoffset:0}}
@keyframes hubFall{0%{transform:translate3d(0,-20px,0) rotate(0);opacity:1}100%{transform:translate3d(var(--x),105vh,0) rotate(var(--r));opacity:.9}}
.hub-anim>header{animation:hubFade .3s ease both}
.hub-anim>.sec,.hub-anim>.banner{animation:hubUp .45s cubic-bezier(.2,.8,.2,1) both}
.hub-anim>.sec:nth-of-type(2){animation-delay:.06s}.hub-anim>.sec:nth-of-type(3){animation-delay:.12s}.hub-anim>.sec:nth-of-type(4){animation-delay:.18s}.hub-anim>.sec:nth-of-type(5){animation-delay:.24s}.hub-anim>.sec:nth-of-type(6){animation-delay:.3s}
.hub-best .addb:not([disabled]){animation:hubPulse 1.9s ease-out infinite}
.hub-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px;vertical-align:1px;animation:hubBlink 1.1s ease-in-out infinite}
.sec .addb{transition:transform .12s ease}.sec .addb:active{transform:scale(.96)}
.hub-ok{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:color-mix(in srgb,var(--bg) 94%,transparent);animation:hubFade .25s ease both;overflow:hidden;text-align:center;padding:24px}
.hub-ok svg{width:96px;height:96px;animation:hubPop .5s cubic-bezier(.2,.9,.3,1.3) both}
.hub-ok circle{stroke:var(--ok);stroke-width:5;fill:none;stroke-dasharray:252;stroke-dashoffset:252;animation:hubDraw .55s .1s ease-out forwards}
.hub-ok path{stroke:var(--ok);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:hubDraw .35s .55s ease-out forwards}
.hub-ok b{font-size:18px;animation:hubUp .4s .5s both}
.hub-ok i{position:absolute;top:0;width:8px;height:14px;border-radius:2px;animation:hubFall 1.9s cubic-bezier(.3,.6,.5,1) forwards}
@media (prefers-reduced-motion:reduce){.hub-anim>header,.hub-anim>.sec,.hub-anim>.banner,.hub-best .addb,.hub-dot,.hub-ok,.hub-ok svg,.hub-ok b{animation:none!important}.hub-ok circle,.hub-ok path{animation:none!important;stroke-dashoffset:0}.hub-ok i{display:none}}
/* fix155-custbot: mijozning sahifasi (?v=my) */
.my-head{padding:14px 14px 4px}.my-head h1{margin:0;font-size:20px}
.my-card{background:var(--surface);border-radius:18px;margin:10px 14px;padding:14px;animation:hubUp .4s cubic-bezier(.2,.8,.2,1) both}
.my-card.debt{background:linear-gradient(135deg,color-mix(in srgb,var(--btn) 14%,var(--surface)),var(--surface))}
.my-big{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.my-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.my-row:first-of-type{border-top:none}
.my-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:8px 0 4px}.my-bar i{display:block;height:100%;border-radius:999px;background:var(--ok);transition:width .6s ease}
.my-bar i.w{background:#e3a008}.my-bar i.d{background:var(--danger)}
.my-badge{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--link)}
.my-badge.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}.my-badge.warn{background:#fff6e5;color:#b7791f}
.my-acts{display:flex;gap:8px;margin-top:10px}.my-acts .btn2{flex:1;margin:0}
.my-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.my-item:first-child{border-top:none}.my-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--soft);flex-shrink:0}
.my-ic.p{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}.my-ic.c{background:#fff6e5}
.my-it{flex:1;min-width:0}.my-it b{display:block;font-size:14px}.my-it .muted{font-size:12px}
.my-sum{font-weight:800;white-space:nowrap}.my-sum.p{color:var(--ok)}
.my-lines{margin:0 0 6px 48px;font-size:13px;color:var(--hint);display:none}.my-item.open + .my-lines{display:block}
.my-empty{text-align:center;padding:40px 20px;color:var(--hint)}
.my-tog{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:none;flex-shrink:0;transition:background .2s}.my-tog.on{background:var(--ok)}
.my-tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.my-tog.on::after{left:21px}
</style>

}
function renderCart(){
  var tt = totals(), keys = Object.keys(S.cart), sh = S.shop;

  if(!keys.length){ return h + '<div class="empty">' + esc(t('cartEmpty')) + '</div><div class="bar"><button id="b-back2"><span>' + esc(t('back')) + '</span><span></span></button></div>'; }
  h += bannerHtml();
  h += '<div class="sec"><h3>' + esc(t('goods')) + '</h3>';
  keys.forEach(function(k){
    var c = S.cart[k], it = S.byId[c.id]; if(!it) return;

    h += '<div class="line"><div class="lt"><div class="ln">' + esc(it.n) + (v ? ' · ' + esc(vLabel(it, v)) : '') + '</div><div class="lp">' + esc(money(pr)) + ((v && v.k) ? ' / ' + esc(vUnit(it, v)) : (it.u !== 'dona' ? ' / ' + esc(unitL(it.u)) : '')) + ' · <b>' + esc(money(rnd(pr * c.q))) + '</b></div></div>'
      + '<div class="step"><button data-ldec="' + esc(k) + '">−</button><button class="qv" data-lqty="' + esc(k) + '">' + esc(qtyStr(c.q)) + '</button><button data-linc="' + esc(k) + '">+</button></div></div>';
  });
  h += '</div>';
  h += '<div class="sec"><h3>' + esc(t('howGet')) + '</h3>';
  if(sh.pickup && sh.delivery) h += '<div class="seg"><button data-mode="pickup" class="' + (S.form.mode === 'pickup' ? 'on' : '') + '">🏪 ' + esc(t('pickup')) + '</button><button data-mode="delivery" class="' + (S.form.mode === 'delivery' ? 'on' : '') + '">🚚 ' + esc(t('delivery')) + '</button></div>';
  else h += '<div class="okp">' + (sh.delivery ? '🚚 ' + esc(t('delivery')) : '🏪 ' + esc(t('pickup'))) + '</div>';
  if(S.form.mode === 'delivery'){
    h += '<div class="fld"><label for="f-addr">' + esc(t('address')) + '</label><textarea id="f-addr" rows="2" placeholder="' + esc(t('addressPh')) + '">' + esc(S.form.address || '') + '</textarea></div>';
    h += S.form.loc ? '<div class="okp" style="margin-top:8px;">' + esc(t('locOk')) + ' <button class="lnk" id="b-locdel">' + esc(t('locDel')) + '</button></div>' : '<button class="btn2" id="b-loc" style="margin-top:8px;">' + esc(t('addLoc')) + '</button>';
    if(sh.freeFrom > 0) h += '<div class="muted" style="margin-top:8px;">' + esc(t('freeFrom', { sum: money(sh.freeFrom) })) + '</div>';
  } else if(sh.address) h += '<div class="muted" style="margin-top:8px;">' + esc(t('pickupAt', { a: sh.address })) + '</div>';
  h += '</div>';
  h += '<div class="sec"><h3>' + esc(t('contact')) + '</h3>';
  h += '<div class="fld" style="margin-top:0"><label for="f-name">' + esc(t('name')) + '</label><input id="f-name" maxlength="80" value="' + esc(S.form.name || '') + '" autocomplete="name"></div>';
  h += '<div class="fld"><label>' + esc(t('phone')) + '</label>';
  if(S.me.phone && S.me.phoneOk && !S.phoneEdit) h += '<div class="okp">' + esc(S.me.phone) + ' <span class="b">✓ ' + esc(t('phoneOk')) + '</span></div><button class="lnk" id="b-phedit">' + esc(t('phoneChange')) + '</button>';
  else {
    if(TG && TG.requestContact && !(S.me.phone && S.me.phoneOk)) h += '<button class="btn2" id="b-contact">' + esc(S.waitPhone ? t('phoneWait') : t('phoneSend')) + '</button><div class="muted" style="margin:8px 0 5px;">' + esc(t('phoneOr')) + '</div>';
    h += '<input id="f-phone" type="tel" inputmode="tel" maxlength="20" placeholder="+998 90 123 45 67" value="' + esc(S.form.phone || '') + '" autocomplete="tel">';
  }
  h += '</div></div>';
  h += '<div class="sec"><h3>' + esc(t('pay')) + '</h3><div class="seg"><button data-pay="cash" class="' + (S.form.pay !== 'card' ? 'on' : '') + '">' + esc(t('cash')) + '</button><button data-pay="card" class="' + (S.form.pay === 'card' ? 'on' : '') + '">' + esc(t('card')) + '</button></div><div class="muted" style="margin-top:8px;">' + esc(t('payHint')) + '</div>';
  h += '<div class="fld"><label for="f-note">' + esc(t('comment')) + '</label><textarea id="f-note" rows="2" maxlength="300" placeholder="' + esc(t('commentPh')) + '">' + esc(S.form.comment || '') + '</textarea></div></div>';
  h += '<div class="sec" id="sum">' + sumHtml(tt) + '</div>';
  h += '<div class="err" id="err">' + esc(S.err || '') + '</div>';
  var blocked = !canOrder() || (sh.minOrder > 0 && tt.sub < sh.minOrder);
  h += '<div class="bar"><button id="b-send"' + (blocked || S.busy ? ' disabled' : '') + '><span>' + esc(S.busy ? t('sending') : t('order')) + '</span><span>' + esc(money(tt.total)) + '</span></button></div>';
  return h;
}
function sumHtml(tt){
  var sh = S.shop, h = '<div class="row"><span>' + esc(t('goods')) + '</span><span>' + esc(money(tt.sub)) + '</span></div>';
  if(S.form.mode === 'delivery') h += '<div class="row"><span>' + esc(t('fee')) + '</span><span>' + esc(tt.fee > 0 ? money(tt.fee) : t('free')) + '</span></div>';
  h += '<div class="row t"><span>' + esc(t('total')) + '</span><span>' + esc(money(tt.total)) + '</span></div>';
  if(sh.minOrder > 0 && tt.sub < sh.minOrder) h += '<div class="muted" style="color:var(--danger);margin-top:6px;">' + esc(t('minOrder', { sum: money(sh.minOrder) })) + '</div>';
  return h;
}
function dtStr(ms){ var d = new Date(ms), z = function(n){ return (n < 10 ? '0' : '') + n; }; return z(d.getDate()) + '.' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function stName(s){ return t('st_' + s); }
function orderCard(o, withCancel){
  var h = '<div class="ord"><div class="oh"><b>#' + esc(o.no) + ' · ' + esc(money(o.total)) + '</b><span class="st ' + esc(o.status) + '">' + esc(stName(o.status)) + (o.status === 'accepted' && o.eta ? ' · ' + esc(t('eta', { m: o.eta })) : '') + '</span></div>';
  h += '<div class="muted" style="margin-top:4px;">' + esc(dtStr(o.createdAt)) + ' · ' + esc(o.mode === 'delivery' ? t('modeDel') : t('modePick')) + '</div>';
  h += '<div style="margin-top:8px;font-size:13.5px;">' + (o.items || []).map(function(x){ return esc(x.name) + (x.vName ? ' · ' + esc(x.vName) : '') + ' × ' + esc(qtyStr(x.qty)); }).join('<br>') + '</div>';
  if(o.reason) h += '<div class="muted" style="margin-top:6px;">' + esc(o.reason) + '</div>';
  if(withCancel && o.status === 'new') h += '<button class="btn2" style="margin-top:10px;color:var(--danger)" data-cancel="' + esc(o.id) + '">' + esc(t('cancel')) + '</button>';
  return h + '</div>';
}
function renderDone(){
  var o = S.last;
  var h = '<div class="done"><div class="ic">' + IC.check + '</div><h2>' + esc(t('doneT')) + '</h2><div class="muted" style="font-size:14px;">' + esc(t('doneS', { no: o.no })) + '</div></div>';
  h += orderCard(o, true);
  h += '<div class="sec" style="background:none;padding:0 0;margin-top:14px;"><button class="btn2" id="b-orders2">' + esc(t('myOrders')) + '</button></div>';
  h += '<div class="bar"><button id="b-again"><span>' + esc(t('again')) + '</span><span></span></button></div>';
  return h;
}
function renderOrders(){
  var h = '<header><div class="hrow"><button class="icon-btn" id="b-back" aria-label="' + esc(t('back')) + '">' + IC.back + '</button><h1>' + esc(t('myOrders')) + '</h1></div></header>';
  if(S.orders == null) return h + '<div class="spin"></div>';
  if(!S.orders.length) return h + '<div class="empty">' + esc(t('noOrders')) + '</div>';
  return h + S.orders.map(function(o){ return orderCard(o, true); }).join('');
}
function renderOutside(){
  document.getElementById('app').innerHTML = '<div class="done"><div class="ic" style="color:var(--btn);background:var(--soft)">🛍</div><h2>' + esc(t('outside')) + '</h2><div class="muted" style="font-size:14px;">' + esc(t('outsideHint')) + '</div></div>';
}
function render(){
  var app = document.getElementById('app');
  if(S.view === 'fatal'){ app.innerHTML = '<div class="done"><h2 style="font-size:18px;">' + esc(S.err) + '</h2><button class="btn2" id="b-retry" style="max-width:260px;margin-top:16px;">' + esc(t('retry')) + '</button></div>'; bind(); return; }
  if(!S.shop){ app.innerHTML = '<div class="spin"></div>'; return; }
  app.innerHTML = S.view === 'cart' ? renderCart() : S.view === 'done' ? renderDone() : S.view === 'orders' ? renderOrders() : renderShop();
  bind();
  try{
    if(TG && TG.BackButton){ if(S.view === 'shop') TG.BackButton.hide(); else TG.BackButton.show(); }
  }catch(e){}
}
function go(v){ S.view = v; S.err = ''; window.scrollTo(0, 0); render(); if(v === 'orders') loadOrders(); }
function loadOrders(){
  api('orders').then(function(j){ if(S.view !== 'orders' && S.view !== 'done') return; S.orders = j.ok ? (j.orders || []) : []; S.active = S.orders.filter(function(o){ return ['new','accepted','ready','delivering'].indexOf(o.status) !== -1; }).length; if(S.view === 'orders') render(); });
}
function readForm(){
  var a = document.getElementById('f-addr'), n = document.getElementById('f-name'), p = document.getElementById('f-phone'), c = document.getElementById('f-note');
  if(a) S.form.address = a.value; if(n) S.form.name = n.value; if(p) S.form.phone = p.value; if(c) S.form.comment = c.value;
  saveForm();
}
function openSheet(html, after){
  var sh = document.getElementById('sheet'), bg = document.getElementById('sheet-bg');
  sh.innerHTML = html; sh.classList.add('on'); bg.classList.add('on');
  bg.onclick = closeSheet; if(after) after(sh);
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('sheet-bg').classList.remove('on'); }
function pickVariant(id){
  var it = S.byId[id]; if(!it) return;
  function draw(){
    var h = '<h3>' + esc(it.n) + '</h3><div class="muted" style="margin:-6px 0 8px;">' + esc(t('pick')) + '</div>';
    (it.v || []).forEach(function(v){
      var q = cartQty(id, v.id);
      h += '<div class="line"><div class="lt"><div class="ln">' + esc(vLabel(it, v)) + '</div><div class="lp">' + esc(money(v.p)) + (v.k ? ' / ' + esc(vUnit(it, v)) : (v.bl ? ' / ' + esc(v.bl) : '')) + (v.s ? '' : ' · <span style="color:var(--danger)">' + esc(t('out')) + '</span>') + '</div></div>'
        + (v.s ? (q > 0 ? '<div class="step"><button data-vdec="' + esc(v.id) + '">−</button><button class="qv" data-vqty="' + esc(v.id) + '">' + esc(qtyStr(q)) + '</button><button data-vinc="' + esc(v.id) + '">+</button></div>' : '<button class="addb" style="width:118px;margin:0" data-vinc="' + esc(v.id) + '">' + esc(t('add')) + '</button>') : '') + '</div>';
    });
    h += '<button class="addb" id="v-done" style="margin-top:14px;height:46px;">' + esc(t('done2')) + '</button>';
    return h;
  }
  openSheet(draw(), function(sh){
    sh.onclick = function(e){
      var b = e.target.closest('button'); if(!b) return;
      if(b.id === 'v-done'){ closeSheet(); refreshGrid(); return; }
      var vi = b.getAttribute('data-vinc'), vd = b.getAttribute('data-vdec'), vq = b.getAttribute('data-vqty');
      if(vq){ askQty(id, vq, function(){ pickVariant(id); }); return; }   /* fix174-botprice: miqdorni yozish */
      if(vi) setQty(id, vi, cartQty(id, vi) + vStep(it, vSrc(it, vi)));   /* fix193-both */
      if(vd) setQty(id, vd, cartQty(id, vd) - vStep(it, vSrc(it, vd)));
      if(vi || vd){ sh.innerHTML = draw(); refreshGrid(); }
    };
  });
}
function askQty(id, v, after){
  var it = S.byId[id]; if(!it) return;
  var cur = cartQty(id, v);
  var __vs = vSrc(it, v);   /* fix193-both */
  openSheet('<h3>' + esc(it.n) + (__vs && __vs.k ? ' · ' + esc(vLabel(it, __vs)) : '') + '</h3><div class="fld" style="margin-top:0"><label for="qv-in">' + esc(t('qtyP')) + ' (' + esc(vUnit(it, __vs)) + ')</label><input id="qv-in" type="text" inputmode="decimal" value="' + esc(qtyStr(cur)) + '"></div><button class="addb" id="qv-ok" style="margin-top:14px;height:46px;">' + esc(t('done2')) + '</button>', function(sh){
    var inp = sh.querySelector('#qv-in'); setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 50);
    sh.querySelector('#qv-ok').onclick = function(){ var __raw = String(inp.value).trim(); var q = __raw === '' ? 0 : parseFloat(__raw.replace(',', '.')); /* fix191-qty0: bo'sh yoki 0 — savatdan olib tashlash */ if(isFinite(q) && q >= 0){ setQty(id, v, Math.min(q, 9999)); } closeSheet(); if(S.view === 'cart') render(); else refreshGrid(); if(after) after(); };
  });
}
function getLocation(){
  var done = function(lat, lng){ S.form.loc = { lat: lat, lng: lng }; saveForm(); readForm(); render(); haptic('ok'); };
  var fail = function(){ toast(t('locErr')); haptic('err'); };
  try{
    var LM = TG && TG.LocationManager;
    if(LM && typeof LM.init === 'function'){
      LM.init(function(){
        if(!LM.isLocationAvailable){ browserLoc(done, fail); return; }
        LM.getLocation(function(d){ if(d && isFinite(d.latitude)) done(d.latitude, d.longitude); else browserLoc(done, fail); });
      });
      return;
    }
  }catch(e){}
  browserLoc(done, fail);
}
function browserLoc(done, fail){
  if(!navigator.geolocation){ fail(); return; }
  navigator.geolocation.getCurrentPosition(function(p){ done(p.coords.latitude, p.coords.longitude); }, fail, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
function askContact(){
  if(!TG || !TG.requestContact) return;
  S.waitPhone = true; readForm(); render();
  try{
    TG.requestContact(function(ok){
      if(!ok){ S.waitPhone = false; render(); return; }
      var tries = 0;
      (function poll(){
        api('me').then(function(j){
          tries++;
          if(j.ok && j.me && j.me.phone && j.me.phoneOk){ S.me = j.me; S.waitPhone = false; S.phoneEdit = false; S.err = ''; haptic('ok'); render(); return; }
          if(tries < 12) setTimeout(poll, 1000); else { S.waitPhone = false; render(); }
        });
      })();
    });
  }catch(e){ S.waitPhone = false; render(); }
}
function submit(){
  readForm();
  var sh = S.shop, tt = totals();
  if(!tt.lines) return;
  if(S.form.mode === 'delivery' && String(S.form.address || '').trim().length < 3 && !S.form.loc){ S.err = t('e_addr'); render(); haptic('err'); return; }
  var usePhone = (S.me.phone && S.me.phoneOk && !S.phoneEdit) ? '' : String(S.form.phone || '').trim();
  if(!usePhone && !(S.me.phone && S.me.phoneOk)){ S.err = t('e_phone'); render(); haptic('err'); return; }
  if(!S.form.clientId) { S.form.clientId = 'c' + uidStr(); saveForm(); }
  S.busy = true; S.err = ''; render();
  var items = Object.keys(S.cart).map(function(k){ var c = S.cart[k]; return { id: c.id, v: c.v || '', q: c.q }; });
  api('order', { clientId: S.form.clientId, items: items, mode: S.form.mode, address: S.form.mode === 'delivery' ? (S.form.address || '') : '', loc: S.form.mode === 'delivery' ? (S.form.loc || null) : null,
    phone: usePhone, name: S.form.name || '', comment: S.form.comment || '', pay: S.form.pay }).then(function(j){
    S.busy = false;
    if(j.ok){
      S.last = j.order; S.cart = {}; saveCart(); S.form.clientId = ''; S.form.comment = ''; saveForm(); S.active++;
      haptic('ok'); go('done'); return;
    }
    haptic('err');
    if(j.code === 'changed' || j.code === 'out_of_stock' || j.code === 'bad_qty'){
      S.form.clientId = ''; saveForm();
      api('catalog').then(function(c){ if(c.ok){ applyCatalog(c); } S.err = j.code === 'out_of_stock' && S.byId[j.id] ? (j.max ? t('left', { n: qtyStr(j.max), u: unitL(S.byId[j.id].u) }) + ' — ' + S.byId[j.id].n : t('e_stock0', { n: S.byId[j.id].n })) : t('e_changed'); render(); });
      return;
    }
    if(j.code !== 'net') { S.form.clientId = ''; saveForm(); }
    if(j.code === 'paused' || j.code === 'closed_hours'){ api('catalog').then(function(c){ if(c.ok) applyCatalog(c); S.err = errText(j); render(); }); return; }
    S.err = errText(j); render();
  });
}
function cancelOrder(oid){
  var doIt = function(){
    api('cancel', { oid: oid }).then(function(j){
      if(!j.ok){ toast(errText(j)); }
      else { haptic('ok'); if(S.last && S.last.id === oid) S.last = j.order; }
      if(S.view === 'orders'){ S.orders = null; render(); loadOrders(); } else { render(); }
    });
  };
  try{ if(TG && TG.showConfirm){ TG.showConfirm(t('cancelQ'), function(ok){ if(ok) doIt(); }); return; } }catch(e){}
  if(window.confirm(t('cancelQ'))) doIt();
}
function bind(){
  var app = document.getElementById('app');
  app.onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id;
    if(b.id === 'b-retry'){ S.view = 'shop'; S.shop = null; if(HUB){ H.data = null; S.view = 'shop'; } render(); load(); return; }
    if(b.id === 'b-cart'){ go('cart'); return; }
    if(b.id === 'b-share'){ shareTg('https://t.me/' + S.bot + '?start=s_' + SLUG, S.shop.name); return; }   /* fix146-tgsub */
    if(b.id === 'b-back' || b.id === 'b-back2'){ readForm(); go('shop'); return; }
    if(b.id === 'b-orders' || b.id === 'b-orders2'){ S.orders = null; go('orders'); return; }
    if(b.id === 'b-again'){ go('shop'); return; }
    if(b.id === 'b-clear'){ S.cart = {}; saveCart(); render(); return; }
    if(b.id === 'b-send'){ submit(); return; }
    if(b.id === 'b-loc'){ readForm(); getLocation(); return; }
    if(b.id === 'b-locdel'){ readForm(); S.form.loc = null; saveForm(); render(); return; }
    if(b.id === 'b-contact'){ askContact(); return; }
    if(b.id === 'b-phedit'){ readForm(); S.phoneEdit = true; render(); return; }
    if((id = b.getAttribute('data-cat')) !== null){ S.cat = id; render(); return; }
    if((id = b.getAttribute('data-inc'))){ var it = S.byId[id]; setQty(id, '', cartQty(id, '') + stepOf(it)); refreshGrid(); return; }
    if((id = b.getAttribute('data-dec'))){ var it2 = S.byId[id]; setQty(id, '', cartQty(id, '') - stepOf(it2)); refreshGrid(); return; }
    if((id = b.getAttribute('data-qty'))){ askQty(id, ''); return; }
    if((id = b.getAttribute('data-pick'))){ pickVariant(id); return; }
    var lk = b.getAttribute('data-linc') || b.getAttribute('data-ldec') || b.getAttribute('data-lqty');
    if(lk){
      readForm();
      var c = S.cart[lk]; if(!c) return; var it3 = S.byId[c.id];
      if(b.hasAttribute('data-lqty')){ askQty(c.id, c.v); return; }
      setQty(c.id, c.v, c.q + (b.hasAttribute('data-linc') ? 1 : -1) * vStep(it3, vSrc(it3, c.v)));   /* fix193-both */
      render(); return;
    }
    if((id = b.getAttribute('data-mode'))){ readForm(); S.err = ''; S.form.mode = id; saveForm(); render(); return; }
    if((id = b.getAttribute('data-pay'))){ readForm(); S.form.pay = id; saveForm(); render(); return; }
    if((id = b.getAttribute('data-cancel'))){ cancelOrder(id); return; }
  };
  var q = document.getElementById('q');
  if(q) q.oninput = function(){ S.q = q.value; refreshGrid(); };
  ['f-addr','f-name','f-phone','f-note'].forEach(function(fid){ var el = document.getElementById(fid); if(el) el.oninput = function(){ readForm(); if(S.err){ S.err = ''; var er = document.getElementById('err'); if(er) er.textContent = ''; } }; });
}
try{
  if(TG){
    TG.ready(); TG.expand();
    if(TG.BackButton) TG.BackButton.onClick(function(){ var sh = document.getElementById('sheet'); if(sh.classList.contains('on')){ closeSheet(); return; } readForm(); go('shop'); });
    if(TG.disableVerticalSwipes) TG.disableVerticalSwipes();
  }
}catch(e){}
setInterval(function(){ if(document.visibilityState === 'visible' && S.view === 'orders') loadOrders(); }, 15000);
load();
window.__tgs = S;
})();
