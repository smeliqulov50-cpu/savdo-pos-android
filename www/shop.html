<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savdo Pos — onlayn buyurtma</title>
<style>
:root{--accent:#2f6fed;--accent-dark:#1f4fb8;--ink:#16233b;--ink-soft:#51677e;--ink-faint:#8a9bb0;--line:#e3e9f3;--bg:#f3f6fb;--surface:#fff;--teal:#0fa89a;--danger:#d64545;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
header h1{margin:0;font-size:18px;font-weight:800}
header .sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.search{margin:10px 14px 0;position:relative}
.search input{width:100%;padding:11px 36px 11px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-soft)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:960px;margin:0 auto}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.thumb{height:96px;border-radius:10px;background:linear-gradient(135deg,#dfe8fb,#eef2fa);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.price{font-weight:800;color:var(--accent-dark)}
.out{color:var(--danger);font-size:12px;font-weight:700}
.qty{display:flex;align-items:center;gap:6px;margin-top:auto}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;color:var(--accent)}
.qty .add{flex:1;background:var(--accent);color:#fff;border-color:var(--accent);font-size:13px}
.qty span{min-width:24px;text-align:center;font-weight:800}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between;gap:10px;z-index:6}
.bar.on{display:flex}
.bar b{font-size:18px}
.bar .small{font-size:12px;opacity:.75}
.bar button{background:#ff8b4b;color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;z-index:7}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;z-index:8;transform:translateY(100%);transition:transform .2s}
.sheet.on{transform:none}
.sheet h2{margin:0 0 10px;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.row .n{flex:1;min-width:0}
.row .sub{font-size:12px;color:var(--ink-faint)}
.tot{display:flex;justify-content:space-between;padding:12px 0;font-weight:800;font-size:18px}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:#fbfcfe}
.send{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.send a,.send button{flex:1;min-width:140px;text-align:center;padding:13px;border-radius:12px;font-weight:800;font-size:15px;text-decoration:none;border:none;cursor:pointer}
.tg{background:#229ed9;color:#fff}.wa{background:#25d366;color:#fff}.cp{background:var(--bg);color:var(--ink);border:1px solid var(--line)!important}
.empty{padding:60px 20px;text-align:center;color:var(--ink-faint)}
.footer{text-align:center;font-size:11px;color:var(--ink-faint);padding:20px}
.footer a{color:var(--accent)}
.err{color:var(--danger);font-size:13px;margin-top:6px;display:none}
/* fix151-weborder: buyurtma to'g'ridan-to'g'ri do'kon ilovasiga */
.go{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:16px;cursor:pointer;transition:transform .12s ease,opacity .2s}
.go:active{transform:scale(.98)}.go[disabled]{opacity:.6}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.more{display:block;margin:12px auto 0;background:none;border:none;color:var(--ink-faint);text-decoration:underline;font-size:13px;cursor:pointer}
.wnote{font-size:12.5px;color:var(--ink-soft);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px}.wnote.bad{color:var(--danger);background:#fdecec;font-weight:700}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@keyframes wUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes wDraw{to{stroke-dashoffset:0}}
.done{text-align:center;padding:8px 0 4px;animation:wUp .35s both}
.done svg{width:78px;height:78px;animation:wPop .5s cubic-bezier(.2,.9,.3,1.3) both}
.done circle{stroke:#1b8f5a;stroke-width:5;fill:none;stroke-dasharray:252;stroke-dashoffset:252;animation:wDraw .55s .1s ease-out forwards}
.done path{stroke:#1b8f5a;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:wDraw .35s .55s ease-out forwards}
.st{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13px;background:var(--bg)}
.st.s-new{color:#b7791f;background:#fff6e5}.st.s-accepted,.st.s-ready,.st.s-delivering{color:#2563eb;background:#e8f0ff}.st.s-done{color:#1b8f5a;background:#e7f7ef}.st.s-rejected,.st.s-cancelled{color:var(--danger);background:#fdecec}
.ord{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.myo{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--accent);cursor:pointer}
@media (prefers-reduced-motion:reduce){.done,.done svg{animation:none}.done circle,.done path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<header style="position:sticky"><h1 id="shop-name">…</h1><div class="sub" id="shop-sub"></div><button class="myo" id="my-btn" style="display:none"></button></header>
<div class="search"><input id="q" placeholder="Qidirish..."></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none"></div>
<div class="footer">Savdo Pos orqali · <a href="https://savdo-pos.pages.dev/">savdo-pos.pages.dev</a></div>
<div class="bar" id="bar"><div><div class="small" id="bar-count"></div><b id="bar-total"></b></div><button id="bar-btn">Buyurtma berish</button></div>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <h2 id="sh-title">Buyurtma</h2>
  <div id="sh-items"></div>
  <div class="tot"><span id="sh-tot-l">Jami</span><span id="sh-total"></span></div>
  <label id="l-name">Ismingiz</label><input id="f-name" autocomplete="name">
  <label id="l-phone">Telefon</label><input id="f-phone" inputmode="tel" autocomplete="tel">
  <label id="l-addr">Manzil / izoh</label><textarea id="f-addr" rows="2"></textarea>
  <div class="err" id="f-err"></div>
  <input class="hp" id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="send" id="send"></div>
</div>
<script>
const T = {
  uz:{tgNotify:'Telegram\'da xabar olish', tgNotifyHint:'Buyurtma holati o\'zgarsa botdan xabar keladi', search:'Qidirish...', all:'Barchasi', add:'Qo\'shish', out:'Tugagan', order:'Buyurtma berish', items:'ta mahsulot', total:'Jami', name:'Ismingiz', phone:'Telefon', addr:'Manzil / izoh', tg:'Telegram orqali yuborish', wa:'WhatsApp orqali yuborish', copy:'Matnni nusxalash', copied:'Nusxalandi', need:'Ism va telefonni kiriting', notfound:'Do\'kon topilmadi yoki hali nashr qilinmagan', orderT:'Buyurtma', tgHint:'Telegram ochilganda do\'kon chatini tanlang — matn tayyor bo\'ladi.', send:'Buyurtma yuborish', sending:'Yuborilmoqda…', other:'Boshqa usul bilan yuborish', pickup:'Olib ketaman', delivery:'Yetkazib bering', addrD:'Manzil', addrP:'Izoh (ixtiyoriy)', needAddr:'Manzilni yozing', sent:'Buyurtma yuborildi!', no:'Buyurtma #{n}', my:'Buyurtmalarim', cancel:'Bekor qilish', back:'Katalogga qaytish', eta:'taxminan {m} daqiqada', st_new:'Do\'kon ko\'rib chiqmoqda', st_accepted:'Qabul qilindi', st_ready:'Tayyor', st_delivering:'Yo\'lda', st_done:'Yakunlandi', st_rejected:'Rad etildi', st_cancelled:'Bekor qilindi', e_too_many:'Juda ko\'p buyurtma. Birozdan keyin urinib ko\'ring.', e_too_many_active:'Sizda tugallanmagan buyurtmalar ko\'p. Avvalgisini kuting.', e_out_of_stock:'Ba\'zi mahsulot tugab qoldi. Savatni tekshiring.', e_changed:'Katalog o\'zgardi. Sahifani yangilang.', e_net:'Internet bilan muammo. Qayta urinib ko\'ring.', e_off:'Do\'kon hozir buyurtma qabul qilmayapti.', e_phone:'Telefon raqamini to\'g\'ri yozing', keep:'Holatini shu sahifada ko\'rib turasiz.', fee:'Yetkazib berish', feeFree:'bepul', freeFrom:'{s} dan oshsa yetkazib berish bepul', onlyPickup:'Bu do\'kon faqat olib ketish uchun buyurtma qabul qiladi', onlyDelivery:'Bu do\'kon faqat yetkazib berish orqali ishlaydi', e_min:'Minimal buyurtma — {s}. Yana mahsulot qo\'shing.', e_closed:'Do\'kon hozir yopiq. Ish vaqti: {h}', e_paused:'Do\'kon vaqtincha buyurtma qabul qilmayapti.', e_noDelivery:'Yetkazib berish hozir mavjud emas — olib ketishni tanlang.', e_noPickup:'Olib ketish mavjud emas — yetkazib berishni tanlang.'},
  ru:{tgNotify:'Получать уведомления в Telegram', tgNotifyHint:'Бот сообщит, когда статус заказа изменится', search:'Поиск...', all:'Все', add:'Добавить', out:'Нет в наличии', order:'Оформить заказ', items:'товаров', total:'Итого', name:'Ваше имя', phone:'Телефон', addr:'Адрес / комментарий', tg:'Отправить в Telegram', wa:'Отправить в WhatsApp', copy:'Скопировать текст', copied:'Скопировано', need:'Введите имя и телефон', notfound:'Магазин не найден или ещё не опубликован', orderT:'Заказ', tgHint:'В Telegram выберите чат магазина — текст уже готов.', send:'Отправить заказ', sending:'Отправка…', other:'Отправить другим способом', pickup:'Заберу сам', delivery:'Доставка', addrD:'Адрес', addrP:'Комментарий (необязательно)', needAddr:'Укажите адрес', sent:'Заказ отправлен!', no:'Заказ #{n}', my:'Мои заказы', cancel:'Отменить', back:'Вернуться в каталог', eta:'примерно через {m} мин', st_new:'Магазин рассматривает', st_accepted:'Принят', st_ready:'Готов', st_delivering:'В пути', st_done:'Завершён', st_rejected:'Отклонён', st_cancelled:'Отменён', e_too_many:'Слишком много заказов. Попробуйте позже.', e_too_many_active:'У вас много незавершённых заказов. Дождитесь предыдущего.', e_out_of_stock:'Часть товаров закончилась. Проверьте корзину.', e_changed:'Каталог изменился. Обновите страницу.', e_net:'Проблема с интернетом. Попробуйте ещё раз.', e_off:'Магазин сейчас не принимает заказы.', e_phone:'Укажите правильный номер телефона', keep:'Статус можно смотреть на этой странице.', fee:'Доставка', feeFree:'бесплатно', freeFrom:'Бесплатная доставка от {s}', onlyPickup:'Магазин принимает заказы только на самовывоз', onlyDelivery:'Магазин работает только с доставкой', e_min:'Минимальный заказ — {s}. Добавьте ещё товары.', e_closed:'Магазин сейчас закрыт. Часы работы: {h}', e_paused:'Магазин временно не принимает заказы.', e_noDelivery:'Доставка сейчас недоступна — выберите самовывоз.', e_noPickup:'Самовывоз недоступен — выберите доставку.'}
};
let L = T.uz, shop = null, cart = {}, cat = '';
const $ = (id)=>document.getElementById(id);
const dec = ()=> (shop && (shop.cur === 'USD' || shop.cur === 'EUR')) ? 2 : 0;   /* fix151-weborder: dollar va evroda tiyin */
const fmt = (n)=>{ const d = dec(); const v = d ? Math.round((n||0) * 100) / 100 : Math.round(n||0); return v.toLocaleString('ru-RU', d ? {minimumFractionDigits: d, maximumFractionDigits: d} : undefined) + ' ' + ((shop && shop.currency) || "so'm"); };
function slugFromUrl(){
  const m = location.pathname.match(/\/s\/([a-z0-9-]+)/i); if(m) return m[1].toLowerCase();
  const q = new URLSearchParams(location.search).get('s'); if(q) return q.toLowerCase();
  const h = location.hash.replace('#','').replace(/^\//,''); return h ? h.toLowerCase() : '';
}
async function load(){
  const slug = slugFromUrl();
  if(!slug){ showEmpty(L.notfound); return; }
  try{
    const url = `https://firestore.googleapis.com/v1/projects/sardor-pos/databases/(default)/documents/publicShops/${encodeURIComponent(slug)}?key=AIzaSyC-bVU6F68d_kZJ6PforUphA2m7COtn2QY`;
    const r = await fetch(url); if(!r.ok) throw new Error('nf');
    const j = await r.json();
    shop = JSON.parse(j.fields.payload.stringValue);
  }catch(e){ showEmpty(L.notfound); return; }
  L = T[shop.lang] || T.uz;
  document.title = shop.name + ' — ' + L.orderT;
  $('shop-name').textContent = shop.name;
  $('shop-sub').textContent = [shop.address, shop.phone].filter(Boolean).join(' · ');
  $('q').placeholder = L.search; $('bar-btn').textContent = L.order; $('sh-title').textContent = L.orderT; $('sh-tot-l').textContent = L.total;
  $('l-name').textContent = L.name; $('l-phone').textContent = L.phone; $('l-addr').textContent = L.addr;
  try{ cart = JSON.parse(localStorage.getItem('cart_'+slug)||'{}'); }catch(e){}
  renderChips(); render();
  $('q').addEventListener('input', render);
  myBtn();
  if(shop.orders === true) loadRules();   /* fix194-webrules */
}
function showEmpty(t){ $('empty').style.display='block'; $('empty').textContent = t; $('shop-name').textContent = 'Savdo Pos'; }
function cats(){ return [...new Set(shop.products.map(p=>p.category).filter(Boolean))]; }
function renderChips(){
  const c = cats(); if(!c.length){ $('chips').style.display='none'; return; }
  $('chips').innerHTML = [''].concat(c).map(x=>`<button class="chip ${cat===x?'on':''}" data-c="${x}">${x||L.all}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.addEventListener('click', ()=>{ cat = b.dataset.c; renderChips(); render(); }));
}
function lineKey(p, v){ return p.id + (v ? '::'+v.name : ''); }
function render(){
  const q = ($('q').value||'').toLowerCase();
  const rows = [];
  shop.products.forEach(p=>{
    if(cat && p.category !== cat) return;
    if(q && !p.name.toLowerCase().includes(q)) return;
    if(p.variants && p.variants.length) p.variants.forEach(v=>rows.push({p, v, name: p.name+' '+v.name, price: v.price, inStock: v.inStock, unitLabel:''}));
    else rows.push({p, v:null, name: p.name, price: p.price, inStock: p.inStock, unitLabel: p.unitLabel||''});
  });
  $('empty').style.display = rows.length ? 'none' : 'block'; $('empty').textContent = rows.length ? '' : '—';
  $('grid').innerHTML = rows.map(r=>{ const k = lineKey(r.p, r.v); const n = cart[k] ? cart[k].qty : 0; return `
    <div class="card">
      <div class="thumb">${r.p.image ? `<img src="${r.p.image}" alt="">` : r.name.slice(0,1).toUpperCase()}</div>
      <div class="name">${esc(r.name)}</div>
      <div class="price">${fmt(r.price)}${r.unitLabel ? `<span style="font-size:11px;color:var(--ink-faint);font-weight:600;"> / ${esc(r.unitLabel)}</span>` : ''}</div>
      ${r.inStock===false ? `<div class="out">${L.out}</div>` : `<div class="qty">${n ? `<button data-m="${k}">−</button><span>${n}</span><button data-p="${k}">+</button>` : `<button class="add" data-p="${k}">+ ${L.add}</button>`}</div>`}
    </div>`; }).join('');
  $('grid').querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click', ()=>{ const r = rows.find(x=>lineKey(x.p,x.v)===b.dataset.p); cart[b.dataset.p] = {name:r.name + (r.unitLabel ? ' ('+r.unitLabel+')' : ''), price:r.price, qty:(cart[b.dataset.p]?cart[b.dataset.p].qty:0)+1}; save(); render(); }));
  $('grid').querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click', ()=>{ const c = cart[b.dataset.m]; if(!c) return; c.qty--; if(c.qty<=0) delete cart[b.dataset.m]; save(); render(); }));
  renderBar();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function totals(){ let n=0, t=0; Object.values(cart).forEach(c=>{ n+=c.qty; t+=c.qty*c.price; }); return {n,t}; }
function save(){ try{ localStorage.setItem('cart_'+slugFromUrl(), JSON.stringify(cart)); }catch(e){} }
function renderBar(){ const {n,t} = totals(); $('bar').classList.toggle('on', n>0); $('bar-count').textContent = n+' '+L.items; $('bar-total').textContent = fmt(t); }
function orderText(){
  const {t} = totals();
  const lines = Object.values(cart).map((c,i)=>`${i+1}. ${c.name} × ${c.qty} — ${fmt(c.qty*c.price)}`);
  return `🛒 ${L.orderT} — ${shop.name}\n${lines.join('\n')}\n${L.total}: ${fmt(t)}\n${L.name}: ${$('f-name').value.trim()}\n${L.phone}: ${$('f-phone').value.trim()}${$('f-addr').value.trim()?('\n'+L.addr+': '+$('f-addr').value.trim()):''}`;
}
function validate(){ if(!$('f-name').value.trim() || !$('f-phone').value.trim()){ $('f-err').textContent = L.need; $('f-err').style.display='block'; return false; } $('f-err').style.display='none'; return true; }
function openSheet(){
  const {t} = totals();
  $('sh-items').innerHTML = Object.entries(cart).map(([k,c])=>`<div class="row"><div class="n">${esc(c.name)}<div class="sub">${c.qty} × ${fmt(c.price)}</div></div><b>${fmt(c.qty*c.price)}</b></div>`).join('');
  $('sh-total').textContent = fmt(t);
  const btns = [];
  if(shop.telegram) btns.push(`<button class="tg" id="b-tg">${L.tg}</button>`);
  if(shop.whatsapp) btns.push(`<button class="wa" id="b-wa">${L.wa}</button>`);
  btns.push(`<button class="cp" id="b-cp">${L.copy}</button>`);
  if(shop.orders === true) return openOrderSheet(btns);   /* fix151-weborder */
  $('send').innerHTML = btns.join('') + (shop.telegram ? `<div style="flex-basis:100%;font-size:12px;color:var(--ink-faint);margin-top:4px;">${L.tgHint}</div>` : '');
  if($('b-tg')) $('b-tg').addEventListener('click', ()=>{ if(!validate()) return; const txt = orderText(); const u = shop.telegram.replace(/^@/,'');
    window.open(`https://t.me/share/url?url=${encodeURIComponent('https://t.me/'+u)}&text=${encodeURIComponent(txt)}`, '_blank'); });
  if($('b-wa')) $('b-wa').addEventListener('click', ()=>{ if(!validate()) return; window.open(`https://wa.me/${String(shop.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent(orderText())}`, '_blank'); });
  $('b-cp').addEventListener('click', async()=>{ if(!validate()) return; try{ await navigator.clipboard.writeText(orderText()); $('b-cp').textContent = L.copied; }catch(e){} });
  $('sheet-bg').classList.add('on'); $('sheet').classList.add('on');
}
function bindOld(){
  if($('b-tg')) $('b-tg').addEventListener('click', ()=>{ if(!validate()) return; const txt = orderText(); const u = shop.telegram.replace(/^@/,'');
    window.open(`https://t.me/share/url?url=${encodeURIComponent('https://t.me/'+u)}&text=${encodeURIComponent(txt)}`, '_blank'); });
  if($('b-wa')) $('b-wa').addEventListener('click', ()=>{ if(!validate()) return; window.open(`https://wa.me/${String(shop.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent(orderText())}`, '_blank'); });
  if($('b-cp')) $('b-cp').addEventListener('click', async()=>{ if(!validate()) return; try{ await navigator.clipboard.writeText(orderText()); $('b-cp').textContent = L.copied; }catch(e){} });
}
/* ---------- fix151-weborder: buyurtma do'kon ilovasiga ---------- */
const FN_URL = 'https://us-central1-sardor-pos.cloudfunctions.net/telegramShop';
let mode = 'pickup', busy = false, pollT = null;
/* fix194-webrules: bot sozlamasi (olib ketish / yetkazish, narx, «… dan oshsa bepul», minimal buyurtma, ish vaqti, to'xtatish) saytga ham tegishli.
   Server (siteInfo) beradi va buyurtmada o'zi tekshiradi; bot sozlanmagan yoki javob bo'lmasa — avvalgidek (ikkala usul, narx 0). */
let rules = null;
function wOn(){ return !!(rules && rules.configured); }
function wModes(){ const m = wOn() ? ['pickup', 'delivery'].filter(x=>rules[x]) : []; return m.length ? m : ['pickup', 'delivery']; }
function wFee(t){ if(!wOn() || mode !== 'delivery') return 0; return (Number(rules.freeFrom) > 0 && t >= Number(rules.freeFrom)) ? 0 : (Number(rules.fee) || 0); }
function wHours(h){ return h && h.on ? h.from + '–' + h.to : ''; }
function wBlock(t){ if(!wOn()) return ''; if(rules.paused) return L.e_paused; if(rules.open === false) return L.e_closed.replace('{h}', wHours(rules.hours)).replace(/:\s*$/, ''); if(Number(rules.minOrder) > 0 && t < Number(rules.minOrder)) return L.e_min.replace('{s}', fmt(rules.minOrder)); return ''; }
async function loadRules(){ try{ const j = await api({action: 'siteInfo', slug: slugFromUrl()}); if(j && j.ok){ rules = j; if($('seg') && $('sheet').classList.contains('on')) wApply(); } }catch(e){} }
function wApply(){
  const ms = wModes(); if(ms.indexOf(mode) < 0) mode = ms[0];
  const sg = $('seg'); if(sg){ sg.innerHTML = ms.map(m=>`<button type="button" data-mode="${m}">${esc(L[m])}</button>`).join(''); sg.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click', ()=>setMode(b.dataset.mode))); }
  setMode(mode);
}
function wUpd(){
  if(!$('seg')) return;
  const {t} = totals(), f = wFee(t), on = wOn(), ms = wModes();
  let fr = $('sh-fee');
  if(on && mode === 'delivery'){ if(!fr){ document.querySelector('.tot').insertAdjacentHTML('beforebegin', '<div class="row" id="sh-fee"></div>'); fr = $('sh-fee'); } fr.innerHTML = `<div class="n">🚚 ${esc(L.fee)}</div><b>${esc(f > 0 ? fmt(f) : L.feeFree)}</b>`; }
  else if(fr) fr.remove();
  $('sh-total').textContent = fmt(t + f);
  const notes = [], bl = wBlock(t);
  if(on && ms.length === 1) notes.push(`<div class="wnote">${esc(ms[0] === 'pickup' ? L.onlyPickup : L.onlyDelivery)}</div>`);
  if(on && mode === 'delivery' && Number(rules.freeFrom) > 0 && f > 0) notes.push(`<div class="wnote">${esc(L.freeFrom.replace('{s}', fmt(rules.freeFrom)))}</div>`);
  if(bl) notes.push(`<div class="wnote bad" id="w-block">${esc(bl)}</div>`);
  if($('w-note')) $('w-note').innerHTML = notes.join('');
  const g = $('b-go'); if(g && !busy) g.disabled = !!bl;
}
function setMode(m){ mode = m; document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode === m)); $('l-addr').textContent = m === 'delivery' ? L.addrD : L.addrP; wUpd(); }
function openOrderSheet(oldBtns){
  for(const id of ['l-name','f-name','l-phone','f-phone','l-addr','f-addr']) $(id).style.display = '';
  if(!$('seg')) $('l-name').insertAdjacentHTML('beforebegin', '<div class="seg" id="seg"></div><div id="w-note"></div>');   /* fix194-webrules: tugmalar wApply'da */
  $('send').innerHTML = `<button class="go" id="b-go">${esc(L.send)}</button>` + (oldBtns.length ? `<button type="button" class="more" id="b-more">${esc(L.other)}</button><div id="old-send" style="display:none;flex-wrap:wrap;gap:8px;width:100%;margin-top:8px;">${oldBtns.join('')}${shop.telegram ? `<div style="flex-basis:100%;font-size:12px;color:var(--ink-faint);margin-top:4px;">${L.tgHint}</div>` : ''}</div>` : '');
  $('b-go').addEventListener('click', sendOrder);
  wApply(); if(shop.orders === true) loadRules();   /* fix194-webrules */
  if($('b-more')) $('b-more').addEventListener('click', ()=>{ $('old-send').style.display = 'flex'; $('b-more').style.display = 'none'; });
  bindOld();
  $('sheet-bg').classList.add('on'); $('sheet').classList.add('on');
}
function showErr(t){ $('f-err').textContent = t; $('f-err').style.display = 'block'; }
function cid(){ try{ let c = sessionStorage.getItem('wcid_' + slugFromUrl()); if(!c){ c = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('wcid_' + slugFromUrl(), c); } return c; }catch(e){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); } }
function myList(){ try{ return JSON.parse(localStorage.getItem('orders_' + slugFromUrl()) || '[]'); }catch(e){ return []; } }
function mySave(a){ try{ localStorage.setItem('orders_' + slugFromUrl(), JSON.stringify(a.slice(-10))); }catch(e){} }
function myBtn(){ const b = $('my-btn'); if(!b) return; const n = myList().length; b.style.display = n ? '' : 'none'; b.textContent = L.my + (n ? ' (' + n + ')' : ''); b.onclick = ()=>showOrders(null); }
async function api(body){
  const r = await fetch(FN_URL, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!j) throw new Error('net'); return j;
}
async function sendOrder(){
  if(busy) return;
  if(!validate()) return;
  const ph = $('f-phone').value.replace(/\D/g, '');
  if(ph.length < 9){ showErr(L.e_phone); return; }
  const txt = $('f-addr').value.trim();
  if(mode === 'delivery' && txt.length < 3){ showErr(L.needAddr); return; }
  { const __bl = wBlock(totals().t); if(__bl){ showErr(__bl); return; } }   /* fix194-webrules */
  busy = true; const b = $('b-go'); b.disabled = true; b.textContent = L.sending;
  const items = Object.entries(cart).map(([k, c])=>{ const i = k.indexOf('::'); return {id: i < 0 ? k : k.slice(0, i), vn: i < 0 ? '' : k.slice(i + 2), q: c.qty}; });
  try{
    const j = await api({action: 'siteOrder', slug: slugFromUrl(), clientId: cid(), items, name: $('f-name').value.trim(), phone: $('f-phone').value.trim(), mode, address: mode === 'delivery' ? txt : '', comment: mode === 'delivery' ? '' : txt, hp: $('f-hp').value});
    if(!j.ok){ busy = false; b.disabled = false; b.textContent = L.send;
      if(['no_delivery', 'no_pickup', 'paused', 'closed_hours', 'min_order'].indexOf(j.code) !== -1){   /* fix194-webrules */
        showErr(j.code === 'no_delivery' ? L.e_noDelivery : j.code === 'no_pickup' ? L.e_noPickup : j.code === 'paused' ? L.e_paused : j.code === 'min_order' ? L.e_min.replace('{s}', fmt(j.min || 0)) : L.e_closed.replace('{h}', wHours(j.hours)).replace(/:\s*$/, ''));
        loadRules(); return; }
      showErr(j.code === 'too_many' || j.code === 'busy' ? L.e_too_many : j.code === 'too_many_active' ? L.e_too_many_active : j.code === 'out_of_stock' ? L.e_out_of_stock : j.code === 'changed' ? L.e_changed : (j.code === 'orders_off' || j.code === 'closed') ? L.e_off : j.code === 'need_phone' ? L.e_phone : j.code === 'need_address' ? L.needAddr : L.e_net); return; }
    const a = myList().filter(x=>x.id !== j.order.id); a.push({id: j.order.id, t: j.t, no: j.order.no, at: Date.now()}); mySave(a);
    try{ sessionStorage.removeItem('wcid_' + slugFromUrl()); }catch(e){}
    cart = {}; save(); render(); myBtn();
    busy = false; showOrders(j.order, j.bot ? {bot: j.bot, id: j.order.id, t: j.t} : null);   /* fix156-webtg */
  }catch(e){ busy = false; b.disabled = false; b.textContent = L.send; showErr(L.e_net); }
}
function ordHtml(o){
  return `<div class="ord" data-oid="${esc(o.id)}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><b>${esc(L.no.replace('{n}', o.no))}</b><b>${esc(fmt(o.total))}</b></div>
    <div class="st s-${esc(o.status)}">${esc(L['st_' + o.status] || o.status)}${o.status === 'accepted' && o.eta ? ' · ' + esc(L.eta.replace('{m}', o.eta)) : ''}</div>
    ${o.status === 'new' ? `<button type="button" class="more" data-cancel="${esc(o.id)}" style="margin:8px 0 0;">${esc(L.cancel)}</button>` : ''}</div>`;
}
async function showOrders(fresh, tgl){
  for(const id of ['l-name','f-name','l-phone','f-phone','l-addr','f-addr','f-err']) $(id).style.display = 'none';
  if($('seg')) $('seg').remove();
  if($('w-note')) $('w-note').remove(); if($('sh-fee')) $('sh-fee').remove();   /* fix194-webrules */
  $('sh-items').innerHTML = ''; $('sh-total').textContent = ''; $('sh-tot-l').textContent = '';
  $('sh-title').textContent = fresh ? '' : L.my;
  $('send').innerHTML = (fresh ? `<div class="done" style="width:100%"><svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40"/><path d="M30 49l12 12 24-26"/></svg><h2 style="margin:8px 0 2px;">${esc(L.sent)}</h2><div style="font-size:13px;color:var(--ink-faint);">${esc(L.keep)}</div>${tgl ? `<a id="tg-notify" class="go" style="display:block;text-decoration:none;margin:12px 0 2px;background:#2aabee;" href="https://t.me/${esc(tgl.bot)}?start=w_${esc(tgl.id)}_${esc(tgl.t)}" target="_blank" rel="noopener">✈️ ${esc(L.tgNotify)}</a><div style="font-size:12px;color:var(--ink-faint);">${esc(L.tgNotifyHint)}</div>` : ''}</div>` : '')
    + `<div id="ord-list" style="width:100%"></div><button class="go" id="b-back" style="margin-top:14px;">${esc(L.back)}</button>`;
  $('b-back').addEventListener('click', closeSheet);
  $('sheet-bg').classList.add('on'); $('sheet').classList.add('on');
  if(fresh) $('ord-list').innerHTML = ordHtml(fresh);
  await refreshOrders();
  if(pollT) clearInterval(pollT);
  pollT = setInterval(()=>{ if(!$('ord-list') || !$('sheet').classList.contains('on')){ clearInterval(pollT); pollT = null; return; } if(document.visibilityState !== 'hidden') refreshOrders(); }, 8000);
}
async function refreshOrders(){
  const a = myList(); if(!a.length || !$('ord-list')) return;
  try{
    const j = await api({action: 'siteStatus', orders: a.slice().reverse().map(x=>({id: x.id, t: x.t}))});
    if(!j.ok || !$('ord-list')) return;
    $('ord-list').innerHTML = (j.orders || []).sort((x, y)=>(y.createdAt || 0) - (x.createdAt || 0)).map(ordHtml).join('');
    $('ord-list').querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', async ()=>{
      const x = myList().find(z=>z.id === b.dataset.cancel); if(!x) return; b.disabled = true;
      try{ await api({action: 'siteCancel', id: x.id, t: x.t}); }catch(e){}
      refreshOrders();
    }));
  }catch(e){}
}
function closeSheet(){
  $('sheet-bg').classList.remove('on'); $('sheet').classList.remove('on');
  if(pollT){ clearInterval(pollT); pollT = null; }
  for(const id of ['l-name','f-name','l-phone','f-phone','l-addr','f-addr']) $(id).style.display = '';
  $('sh-title').textContent = L.orderT; $('sh-tot-l').textContent = L.total;
}
$('bar-btn').addEventListener('click', openSheet);
$('sheet-bg').addEventListener('click', closeSheet);
load();
</script>
