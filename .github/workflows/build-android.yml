name: Build Savdo Pos Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "twa-manifest.json"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore release keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build Android project from twa-manifest.json
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload AAB (for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: savdo-pos-release-aab
          path: app-release-bundle.aab

      - name: Upload APK (for direct install / testing)
        uses: actions/upload-artifact@v4
        with:
          name: savdo-pos-release-apk
          path: app-release-signed.apk
