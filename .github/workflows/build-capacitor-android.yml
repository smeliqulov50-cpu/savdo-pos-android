name: Build Capacitor Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/android.keystore
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - working-directory: android
        run: ./gradlew bundleRelease assembleRelease -Pandroid.injected.signing.store.file=android.keystore -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=savdopos -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: savdo-pos-aab, path: android/app/build/outputs/bundle/release/*.aab }
      - uses: actions/upload-artifact@v4
        with: { name: savdo-pos-apk, path: android/app/build/outputs/apk/release/*.apk }
